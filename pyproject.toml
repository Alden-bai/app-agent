[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "harness-awm"
version = "0.1.0"
description = "Auditable AWM execution, collection and evaluation harness"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "jsonschema>=4.26,<5", "httpx>=0.28,<1", "mcp>=1.26,<2", "openai>=2.17,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]
tracking = ["swanlab>=0.10.4,<0.11"]
tokens = ["transformers>=4.46,<6"]
train = ["torch==2.10.0", "transformers==5.22.1", "trl==1.17.1", "accelerate==1.15.0", "datasets==5.1.0", "swanlab==0.10.4"]

[project.scripts]
harness-awm = "harness_awm.cli:main"

[project.entry-points."vllm.general_plugins"]
awm_qwen35_text = "harness_awm.training.verl.vllm_plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["harness_awm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

